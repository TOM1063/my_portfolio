<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ページが移転しました</title>
 
  <!-- 3秒後に自動的に新URLへ移動 -->
  <meta http-equiv="refresh" content="3; url=https://tomshinada.jp/works.html">
 
  <!-- 検索エンジンに移転を伝える(SEO対策) -->
  <link rel="canonical" href="https://tomshinada.jp/works.html">
 
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", Meiryo, sans-serif;
      background: #f5f5f5;
      color: #222;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
 
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
 
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
 
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 28px;
    }
 
    a.btn {
      display: inline-block;
      background: #222;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }
 
    a.btn:hover {
      opacity: 0.8;
    }
 
    .note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ポートフォリオサイトを移転しました</h1>
    <p>
      このページは新しいURLに移転しました。<br>
      自動的に移動しない場合は、下のボタンをクリックしてください。
    </p>
    <a class="btn" href="https://example.jp/">新しいサイトへ移動する</a>
    <p class="note">3秒後に自動的に移動します</p>
  </div>
</body>
</html>
